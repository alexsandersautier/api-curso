databases:
  - name: api-curso-db
    databaseName: api_curso
    user: api_curso
    plan: free
    region: oregon

services:
  - type: web
    name: api-curso
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install . && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --noinput && python -m gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: api-curso-db
          property: connectionString
