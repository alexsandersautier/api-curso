[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "api-curso"
version = "0.1.0"
description = "Local Django REST API foundation for a commerce project."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "Django>=5.2,<6.0",
    "djangorestframework>=3.15,<4.0",
    "django-environ>=0.11,<1.0",
    "drf-spectacular>=0.28,<1.0",
    "djangorestframework-simplejwt>=5.5,<6.0",
    "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
include = ["authentication*", "categories*", "core*", "customers*", "users*"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
